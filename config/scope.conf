# SerphunterRecon Scope Configuration
# Use this file with: serphunter.sh -d example.com -s config/scope.conf

# Define in-scope patterns (regex)
[in-scope]
.*\.example\.com$
.*\.api\.example\.com$

# Define out-of-scope patterns (regex, deny takes priority)
[out-of-scope]
.*\.internal\.example\.com$
.*\.legacy\.example\.com$
